<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QC Dashboard - Quality Control Inspection System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        .header {
            background: white;
            border-radius: 15px;
            padding: 25px 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .header h1 { color: #1e3c72; font-size: 1.8em; margin-bottom: 5px; }
        .header p { color: #666; }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .user-info { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }

        .role-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            background: #e3f2fd;
            color: #1565c0;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.4em;
            border-bottom: 3px solid #1e3c72;
            padding-bottom: 10px;
        }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; color: #333; font-weight: 600; }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #1e3c72;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(30, 60, 114, 0.4); }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e0e0e0; }
        .btn-success { background: #4caf50; color: white; }
        .btn-danger { background: #f44336; color: white; }
        .btn-warning { background: #ff9800; color: white; }
        .btn-sm { padding: 8px 16px; font-size: 0.9em; }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card.green { background: linear-gradient(135deg, #43a047 0%, #2e7d32 100%); }
        .stat-card.red { background: linear-gradient(135deg, #e53935 0%, #c62828 100%); }
        .stat-card.orange { background: linear-gradient(135deg, #fb8c00 0%, #ef6c00 100%); }
        .stat-card.purple { background: linear-gradient(135deg, #7b1fa2 0%, #4a148c 100%); }

        .stat-value { font-size: 2.2em; font-weight: 700; }
        .stat-label { font-size: 0.9em; opacity: 0.9; margin-top: 5px; }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            background: rgba(30, 60, 114, 0.1);
            padding: 8px;
            border-radius: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 12px 20px;
            border: none;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: #1e3c72;
            transition: all 0.3s;
        }

        .tab:hover { background: rgba(255,255,255,0.5); }
        .tab.active { background: white; box-shadow: 0 2px 10px rgba(30, 60, 114, 0.3); }

        .tab-count {
            background: rgba(30, 60, 114, 0.2);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            margin-left: 8px;
        }

        .tab.active .tab-count { background: #1e3c72; color: white; }

        /* Inspection Cards */
        .inspection-card {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .inspection-card:hover { box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .inspection-card.urgent { border-left: 4px solid #f44336; }
        .inspection-card.failed { border-left: 4px solid #ff9800; }

        .inspection-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .inspection-id { font-size: 1.2em; font-weight: 700; color: #1e3c72; }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .badge-pending { background: #fff3e0; color: #e65100; }
        .badge-in_progress { background: #e3f2fd; color: #1565c0; }
        .badge-passed { background: #e8f5e9; color: #2e7d32; }
        .badge-failed { background: #ffebee; color: #c62828; }
        .badge-resolved { background: #f3e5f5; color: #7b1fa2; }
        .badge-urgent { background: #ff1744; color: white; animation: pulse 2s infinite; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

        .inspection-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .info-item { display: flex; flex-direction: column; }
        .info-label { font-size: 0.8em; color: #666; margin-bottom: 3px; }
        .info-value { font-weight: 600; color: #333; }

        .inspection-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }

        .modal.show { display: flex; }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 { color: #1e3c72; font-size: 1.3em; }
        .modal-close { font-size: 1.5em; cursor: pointer; color: #666; }
        .modal-close:hover { color: #333; }

        /* Loading & Empty States */
        .loading { text-align: center; padding: 40px; color: #666; }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1e3c72;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .empty-state { text-align: center; padding: 50px 20px; color: #999; }
        .empty-state-icon { font-size: 3em; margin-bottom: 15px; }

        .hidden { display: none !important; }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 { font-size: 1.4em; }
            .tabs { flex-direction: column; }
            .inspection-info { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Section -->
        <div id="loginSection">
            <div class="header">
                <h1>QC Dashboard</h1>
                <p>Quality Control Inspection Management System</p>
            </div>

            <div class="card">
                <h2>Login</h2>
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="your.email@company.com">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password">
                </div>
                <button class="btn btn-primary" onclick="handleLogin()">Login</button>
                <p style="margin-top: 15px; color: #666; font-size: 0.9em;">Demo: Use any email with password "demo123"</p>
            </div>
        </div>

        <!-- Main Dashboard -->
        <div id="dashboardSection" class="hidden">
            <div class="header">
                <div class="header-actions">
                    <div>
                        <h1>QC Dashboard</h1>
                        <div class="user-info">
                            <span>Welcome, <strong id="userName"></strong></span>
                            <span id="roleBadge" class="role-badge"></span>
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="showNewInspectionModal()">+ New Inspection</button>
                        <button class="btn btn-secondary" onclick="refreshData()">Refresh</button>
                        <button class="btn btn-danger" onclick="handleLogout()">Logout</button>
                    </div>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="stat-value" id="statPending">0</div>
                    <div class="stat-label">Pending</div>
                </div>
                <div class="stat-card orange">
                    <div class="stat-value" id="statInProgress">0</div>
                    <div class="stat-label">In Progress</div>
                </div>
                <div class="stat-card green">
                    <div class="stat-value" id="statPassed">0</div>
                    <div class="stat-label">Passed Today</div>
                </div>
                <div class="stat-card red">
                    <div class="stat-value" id="statFailed">0</div>
                    <div class="stat-label">Failed Today</div>
                </div>
                <div class="stat-card purple">
                    <div class="stat-value" id="statDefectRate">0%</div>
                    <div class="stat-label">Defect Rate</div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" data-status="all" onclick="filterByStatus('all')">
                    All <span class="tab-count" id="countAll">0</span>
                </button>
                <button class="tab" data-status="pending" onclick="filterByStatus('pending')">
                    Pending <span class="tab-count" id="countPending">0</span>
                </button>
                <button class="tab" data-status="in_progress" onclick="filterByStatus('in_progress')">
                    In Progress <span class="tab-count" id="countInProgress">0</span>
                </button>
                <button class="tab" data-status="passed" onclick="filterByStatus('passed')">
                    Passed <span class="tab-count" id="countPassedTab">0</span>
                </button>
                <button class="tab" data-status="failed" onclick="filterByStatus('failed')">
                    Failed <span class="tab-count" id="countFailed">0</span>
                </button>
            </div>

            <!-- Inspection Queue -->
            <div class="card">
                <div id="inspectionQueue">
                    <div class="loading"><div class="spinner"></div><p>Loading inspections...</p></div>
                </div>
            </div>
        </div>
    </div>

    <!-- New Inspection Modal -->
    <div id="newInspectionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>New QC Inspection</h3>
                <span class="modal-close" onclick="closeModal('newInspectionModal')">&times;</span>
            </div>
            <form id="newInspectionForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="inspType">Inspection Type *</label>
                        <select id="inspType" required>
                            <option value="">Select type...</option>
                            <option value="inbound">Inbound</option>
                            <option value="outbound">Outbound</option>
                            <option value="returns">Returns</option>
                            <option value="audit">Audit</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="inspClient">Client *</label>
                        <select id="inspClient" required>
                            <option value="">Select client...</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="inspRef">Reference # (PO/Order)</label>
                        <input type="text" id="inspRef" placeholder="PO-12345">
                    </div>
                    <div class="form-group">
                        <label for="inspPriority">Priority</label>
                        <select id="inspPriority">
                            <option value="normal">Normal</option>
                            <option value="urgent">Urgent</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="inspSku">SKU</label>
                        <input type="text" id="inspSku" placeholder="SKU-001">
                    </div>
                    <div class="form-group">
                        <label for="inspQty">Expected Quantity</label>
                        <input type="number" id="inspQty" placeholder="100">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="inspLot">Lot/Batch #</label>
                        <input type="text" id="inspLot" placeholder="LOT-2024-001">
                    </div>
                    <div class="form-group">
                        <label for="inspLocation">Location</label>
                        <input type="text" id="inspLocation" placeholder="Dock 1, Zone A">
                    </div>
                </div>
                <div class="form-group">
                    <label for="inspNotes">Notes</label>
                    <textarea id="inspNotes" rows="3" placeholder="Additional details..."></textarea>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('newInspectionModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Inspection</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Complete Inspection Modal -->
    <div id="completeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Complete Inspection: <span id="completeInspId"></span></h3>
                <span class="modal-close" onclick="closeModal('completeModal')">&times;</span>
            </div>
            <form id="completeForm">
                <input type="hidden" id="completeId">
                <div class="form-row">
                    <div class="form-group">
                        <label for="qtyInspected">Quantity Inspected *</label>
                        <input type="number" id="qtyInspected" required>
                    </div>
                    <div class="form-group">
                        <label for="qtyPassed">Quantity Passed *</label>
                        <input type="number" id="qtyPassed" required>
                    </div>
                    <div class="form-group">
                        <label for="qtyFailed">Quantity Failed *</label>
                        <input type="number" id="qtyFailed" required value="0">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="defectType">Defect Type (if failed)</label>
                        <select id="defectType">
                            <option value="">None - All Passed</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="disposition">Disposition (if failed)</label>
                        <select id="disposition">
                            <option value="">N/A</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="defectNotes">Defect Notes</label>
                    <textarea id="defectNotes" rows="3" placeholder="Describe the defects..."></textarea>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('completeModal')">Cancel</button>
                    <button type="submit" class="btn btn-success">Complete Inspection</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ============ CONFIGURATION ============
        const CONFIG = {
            API_URL: window.location.origin + '/api',
            token: null,
            user: null
        };

        let allInspections = [];
        let clients = [];
        let defectTypes = [];
        let dispositions = [];
        let currentFilter = 'all';

        // ============ INITIALIZATION ============
        document.addEventListener('DOMContentLoaded', function() {
            // Check saved session
            const savedToken = localStorage.getItem('qcDashboardToken');
            const savedUser = localStorage.getItem('qcDashboardUser');

            if (savedToken && savedUser) {
                CONFIG.token = savedToken;
                CONFIG.user = JSON.parse(savedUser);
                showDashboard();
            }

            // Form handlers
            document.getElementById('newInspectionForm').addEventListener('submit', handleCreateInspection);
            document.getElementById('completeForm').addEventListener('submit', handleCompleteInspection);

            // Auto-calculate failed quantity
            document.getElementById('qtyInspected').addEventListener('input', calcFailed);
            document.getElementById('qtyPassed').addEventListener('input', calcFailed);
        });

        function calcFailed() {
            const inspected = parseInt(document.getElementById('qtyInspected').value) || 0;
            const passed = parseInt(document.getElementById('qtyPassed').value) || 0;
            document.getElementById('qtyFailed').value = Math.max(0, inspected - passed);
        }

        // ============ AUTHENTICATION ============
        async function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                alert('Please enter email and password');
                return;
            }

            try {
                const response = await fetch(`${CONFIG.API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    CONFIG.token = data.token;
                    CONFIG.user = data.user;
                    localStorage.setItem('qcDashboardToken', data.token);
                    localStorage.setItem('qcDashboardUser', JSON.stringify(data.user));
                    showDashboard();
                } else {
                    alert('Login failed: ' + (data.error || 'Invalid credentials'));
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('Connection error. Please check if the server is running.');
            }
        }

        function handleLogout() {
            localStorage.removeItem('qcDashboardToken');
            localStorage.removeItem('qcDashboardUser');
            CONFIG.token = null;
            CONFIG.user = null;
            location.reload();
        }

        // ============ DASHBOARD ============
        async function showDashboard() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');

            document.getElementById('userName').textContent = CONFIG.user.name;
            document.getElementById('roleBadge').textContent = CONFIG.user.role.toUpperCase();

            await loadLookupData();
            await refreshData();
        }

        async function loadLookupData() {
            try {
                const headers = { 'Authorization': `Bearer ${CONFIG.token}` };

                const [clientsRes, defectsRes, disposRes] = await Promise.all([
                    fetch(`${CONFIG.API_URL}/clients`, { headers }),
                    fetch(`${CONFIG.API_URL}/defect-types`, { headers }),
                    fetch(`${CONFIG.API_URL}/dispositions`, { headers })
                ]);

                const clientsData = await clientsRes.json();
                const defectsData = await defectsRes.json();
                const disposData = await disposRes.json();

                clients = clientsData.clients || [];
                defectTypes = defectsData.defectTypes || [];
                dispositions = disposData.dispositions || [];

                // Populate dropdowns
                populateSelect('inspClient', clients, 'id', 'name');
                populateSelect('defectType', defectTypes, 'id', 'name', true);
                populateSelect('disposition', dispositions, 'id', 'name', true);
            } catch (error) {
                console.error('Error loading lookup data:', error);
            }
        }

        function populateSelect(selectId, items, valueField, textField, addEmpty = false) {
            const select = document.getElementById(selectId);
            if (!select) return;

            const firstOption = select.options[0];
            select.innerHTML = '';
            if (firstOption) select.appendChild(firstOption);

            items.forEach(item => {
                const option = document.createElement('option');
                option.value = item[valueField];
                option.textContent = item[textField];
                select.appendChild(option);
            });
        }

        async function refreshData() {
            await Promise.all([loadDashboardMetrics(), loadInspectionQueue()]);
        }

        async function loadDashboardMetrics() {
            try {
                const response = await fetch(`${CONFIG.API_URL}/dashboard`, {
                    headers: { 'Authorization': `Bearer ${CONFIG.token}` }
                });
                const data = await response.json();

                if (data.success) {
                    const m = data.metrics;
                    document.getElementById('statPending').textContent = m.pending || 0;
                    document.getElementById('statInProgress').textContent = m.in_progress || 0;
                    document.getElementById('statPassed').textContent = m.passed || 0;
                    document.getElementById('statFailed').textContent = m.failed || 0;
                    document.getElementById('statDefectRate').textContent = (m.defect_rate || 0) + '%';
                }
            } catch (error) {
                console.error('Error loading metrics:', error);
            }
        }

        async function loadInspectionQueue() {
            const container = document.getElementById('inspectionQueue');

            try {
                const response = await fetch(`${CONFIG.API_URL}/inspections/queue`, {
                    headers: { 'Authorization': `Bearer ${CONFIG.token}` }
                });
                const data = await response.json();

                if (data.success) {
                    allInspections = [
                        ...(data.pending || []),
                        ...(data.in_progress || []),
                        ...(data.passed || []),
                        ...(data.failed || [])
                    ];

                    updateTabCounts(data);
                    renderInspections();
                }
            } catch (error) {
                console.error('Error loading queue:', error);
                container.innerHTML = '<div class="empty-state"><p>Error loading inspections</p></div>';
            }
        }

        function updateTabCounts(data) {
            document.getElementById('countAll').textContent = allInspections.length;
            document.getElementById('countPending').textContent = (data.pending || []).length;
            document.getElementById('countInProgress').textContent = (data.in_progress || []).length;
            document.getElementById('countPassedTab').textContent = (data.passed || []).length;
            document.getElementById('countFailed').textContent = (data.failed || []).length;
        }

        function filterByStatus(status) {
            currentFilter = status;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.tab[data-status="${status}"]`).classList.add('active');
            renderInspections();
        }

        function renderInspections() {
            const container = document.getElementById('inspectionQueue');
            let filtered = allInspections;

            if (currentFilter !== 'all') {
                filtered = allInspections.filter(i => i.status === currentFilter);
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <h3>No inspections</h3>
                        <p>Create a new inspection to get started</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(insp => createInspectionCard(insp)).join('');
        }

        function createInspectionCard(insp) {
            const isUrgent = insp.priority === 'urgent';
            const isFailed = insp.status === 'failed';

            return `
                <div class="inspection-card ${isUrgent ? 'urgent' : ''} ${isFailed ? 'failed' : ''}">
                    <div class="inspection-header">
                        <div>
                            <span class="inspection-id">${insp.inspection_id}</span>
                            ${isUrgent ? '<span class="badge badge-urgent">URGENT</span>' : ''}
                        </div>
                        <span class="badge badge-${insp.status}">${insp.status.replace('_', ' ').toUpperCase()}</span>
                    </div>
                    <div class="inspection-info">
                        <div class="info-item">
                            <span class="info-label">Type</span>
                            <span class="info-value">${insp.inspection_type.toUpperCase()}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Client</span>
                            <span class="info-value">${insp.client_name || 'N/A'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">SKU</span>
                            <span class="info-value">${insp.sku || 'N/A'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Quantity</span>
                            <span class="info-value">${insp.quantity_expected || 'N/A'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Location</span>
                            <span class="info-value">${insp.location || 'N/A'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Reference</span>
                            <span class="info-value">${insp.reference_number || 'N/A'}</span>
                        </div>
                    </div>
                    <div class="inspection-actions">
                        ${renderActions(insp)}
                    </div>
                </div>
            `;
        }

        function renderActions(insp) {
            switch (insp.status) {
                case 'pending':
                    return `<button class="btn btn-primary btn-sm" onclick="startInspection('${insp.inspection_id}')">Start Inspection</button>`;
                case 'in_progress':
                    return `<button class="btn btn-success btn-sm" onclick="showCompleteModal('${insp.inspection_id}', ${insp.quantity_expected || 0})">Complete</button>`;
                case 'passed':
                case 'failed':
                    return `<button class="btn btn-secondary btn-sm" onclick="resolveInspection('${insp.inspection_id}')">Resolve</button>`;
                default:
                    return '';
            }
        }

        // ============ INSPECTION ACTIONS ============
        async function handleCreateInspection(e) {
            e.preventDefault();

            const data = {
                inspection_type: document.getElementById('inspType').value,
                client_id: document.getElementById('inspClient').value || null,
                reference_number: document.getElementById('inspRef').value,
                priority: document.getElementById('inspPriority').value,
                sku: document.getElementById('inspSku').value,
                quantity_expected: parseInt(document.getElementById('inspQty').value) || null,
                lot_number: document.getElementById('inspLot').value,
                location: document.getElementById('inspLocation').value,
                notes: document.getElementById('inspNotes').value
            };

            try {
                const response = await fetch(`${CONFIG.API_URL}/inspections`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${CONFIG.token}`
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    alert(`Inspection ${result.inspection.inspection_id} created!`);
                    closeModal('newInspectionModal');
                    document.getElementById('newInspectionForm').reset();
                    refreshData();
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error creating inspection');
                console.error(error);
            }
        }

        async function startInspection(inspectionId) {
            try {
                const response = await fetch(`${CONFIG.API_URL}/inspections/${inspectionId}/start`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${CONFIG.token}` }
                });

                const result = await response.json();
                if (result.success) {
                    refreshData();
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error starting inspection');
            }
        }

        function showCompleteModal(inspectionId, expectedQty) {
            document.getElementById('completeId').value = inspectionId;
            document.getElementById('completeInspId').textContent = inspectionId;
            document.getElementById('qtyInspected').value = expectedQty || '';
            document.getElementById('qtyPassed').value = expectedQty || '';
            document.getElementById('qtyFailed').value = 0;
            document.getElementById('completeModal').classList.add('show');
        }

        async function handleCompleteInspection(e) {
            e.preventDefault();

            const inspectionId = document.getElementById('completeId').value;
            const data = {
                quantity_inspected: parseInt(document.getElementById('qtyInspected').value),
                quantity_passed: parseInt(document.getElementById('qtyPassed').value),
                quantity_failed: parseInt(document.getElementById('qtyFailed').value),
                defect_type_id: document.getElementById('defectType').value || null,
                disposition_id: document.getElementById('disposition').value || null,
                defect_notes: document.getElementById('defectNotes').value
            };

            try {
                const response = await fetch(`${CONFIG.API_URL}/inspections/${inspectionId}/complete`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${CONFIG.token}`
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    closeModal('completeModal');
                    refreshData();
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error completing inspection');
            }
        }

        async function resolveInspection(inspectionId) {
            if (!confirm('Mark this inspection as resolved?')) return;

            try {
                const response = await fetch(`${CONFIG.API_URL}/inspections/${inspectionId}/resolve`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${CONFIG.token}` }
                });

                const result = await response.json();
                if (result.success) {
                    refreshData();
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error resolving inspection');
            }
        }

        // ============ MODAL FUNCTIONS ============
        function showNewInspectionModal() {
            document.getElementById('newInspectionModal').classList.add('show');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('show');
        }

        // Close modal on outside click
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.classList.remove('show');
            }
        };
    </script>
</body>
</html>
